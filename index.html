<!DOCTYPE html> <html lang="fr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>LingoFlash Global - Premium</title> <style> body { background: linear-gradient(135deg, #0f172a, #1e1b4b); color: #ffffff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; } h1 { font-size: 2.5rem; text-shadow: 0 0 10px rgba(99, 102, 241, 0.5); margin-bottom: 5px; } .subtitle { color: #94a3b8; margin-bottom: 25px; } /* Section Flashcards */ .card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 20px; width: 320px; height: 180px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: bold; cursor: pointer; transition: transform 0.3s; text-align: center; } .card:hover { transform: scale(1.03); } .btn-next { margin: 15px 0 40px 0; background: #6366f1; color: white; border: none; padding: 10px 25px; font-size: 1rem; border-radius: 8px; cursor: pointer; } /* Section Premium Vidéos */ .premium-container { width: 100%; max-width: 600px; text-align: left; } .section-title { font-size: 1.4rem; color: #38bdf8; margin-bottom: 15px; display: flex; justify-content: space-between; } .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; } .video-box { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; position: relative; min-height: 80px; display: flex; flex-direction: column; justify-content: center; cursor: not-allowed; } .video-box h3 { margin: 0 0 5px 0; font-size: 1rem; } .video-box p { margin: 0; font-size: 0.8rem; color: #94a3b8; } .lock-icon { position: absolute; top: 15px; right: 15px; font-size: 1.2rem; } /* CTA Paywall */ .paywall-btn { grid-column: span 2; background: linear-gradient(90deg, #f59e0b, #ef4444); color: white; font-weight: bold; border: none; padding: 15px; border-radius: 10px; cursor: pointer; text-align: center; font-size: 1.1rem; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); margin-top: 10px; } </style> </head> <body> <h1>⚡ LingoFlash Global ⚡</h1> <div class="subtitle">Apprends comme un pro - Version Pro intégrant le modèle Memrise</div> <!-- Zone Flashcards Gratuite --> <div class="card" id="flashcard" onclick="flipCard()">Hello</div> <button class="btn-next" onclick="nextCard()">Mot Suivant ➡️</button> <!-- Zone Vidéo Payante --> <div class="premium-container"> <div class="section-title"> <span>📹 Leçons Vidéos des Natifs (Premium)</span> </div> <div class="video-grid"> <div class="video-box"> <h3>🗣️ Prononciation : Les bases</h3> <p>Durée: 12 mins • Vidéo HD</p> <div class="lock-icon">🔒</div> </div> <div class="video-box"> <h3>✈️ Commander au restaurant</h3> <p>Durée: 18 mins • Vidéo HD</p> <div class="lock-icon">🔒</div> </div> <button class="paywall-btn" onclick="alert('Redirection vers la passerelle de paiement sécurisée Stripe... (9.99$/mois)')"> 🚀 Débloquer toutes les vidéos (9.99$ / mois) </button> </div> </div> <script> const words = [ { eng: "Hello", fr: "Bonjour 👋" }, { eng: "Thank you", fr: "Merci 🙏" }, { eng: "Goodbye", fr: "Au revoir 🏁" } ]; let currentIndex = 0; let isFlipped = false; function flipCard() { const card = document.getElementById('flashcard'); isFlipped = !isFlipped; if (isFlipped) { card.innerText = words[currentIndex].fr; card.style.color = "#38bdf8"; } else { card.innerText = words[currentIndex].eng; card.style.color = "#ffffff"; } } function nextCard() { currentIndex = (currentIndex + 1) % words.length; isFlipped = false; const card = document.getElementById('flashcard'); card.innerText = words[currentIndex].eng; card.style.color = "#ffffff"; } </script> </body> </html>
