<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoFlash Global - Pro</title>
    <style>
        body {
            background-color: #0f1123;
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.025em;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        main {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .controls-zone {
            background-color: #161a36;
            border: 1px solid #232954;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        label {
            font-weight: 700;
            color: #3b82f6;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        select, input {
            background-color: #0f1123;
            color: white;
            border: 1px solid #2d3566;
            padding: 10px 14px;
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        select {
            width: 160px;
            cursor: pointer;
        }

        input {
            width: 100%;
            box-sizing: border-box;
        }

        select:focus, input:focus {
            border-color: #3b82f6;
        }

        .card-container {
            background-color: #1b2044;
            border: 1px solid #2d3566;
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .word-display {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .translation-display {
            color: #94a3b8;
            font-style: italic;
            font-size: 0.95rem;
        }

        .card-footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(45, 53, 102, 0.5);
        }

        .counter {
            font-size: 0.75rem;
            color: #94a3b8;
            background-color: #0f1123;
            padding: 4px 12px;
            border-radius: 9999px;
            font-weight: 500;
        }

        .audio-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: transform 0.2s, background-color 0.2s;
        }

        .audio-btn:hover {
            background-color: #1d4ed8;
            transform: scale(1.05);
        }

        .next-btn-container {
            display: flex;
            justify-content: center;
        }

        .next-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            transition: background-color 0.2s;
        }

        .next-btn:hover:not(:disabled) {
            background-color: #1d4ed8;
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .premium-zone {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .premium-title {
            font-size: 1rem;
            font-weight: 700;
            color: #d1d5db;
        }

        .video-grid {
            display: grid;
            grid-template-cols: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 500px) {
            .video-grid { grid-template-cols: 1fr; }
        }

        .video-card {
            background-color: #131730;
            border: 1px solid #232954;
            border-radius: 8px;
            padding: 20px;
            position: relative;
        }

        .lock-icon {
            position: absolute;
            top: 16px;
            right: 16px;
            color: #64748b;
            font-size: 0.85rem;
        }

        .video-card h4 {
            margin: 0 0 4px 0;
            font-size: 0.95rem;
            color: #ffffff;
        }

        .video-card p {
            margin: 0;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .premium-btn {
            background: linear-gradient(90deg, #f59e0b, #f97316, #eab308);
            color: #0f1123;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.2);
            transition: opacity 0.2s, transform 0.2s;
            margin-top: 4px;
        }

        .premium-btn:hover {
            opacity: 0.95;
            transform: scale(1.005);
        }
    </style>
</head>
<body>

        <div class="next-btn-container">

        <div class="premium-zone">

            </div>
            <button class="premium-btn">⭐ Débloquer tout le contenu Mondial (9.99$ / mois)</button>
        </div>
    </main>
