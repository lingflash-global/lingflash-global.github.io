<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoFlash Global - Premium Multi-Langues</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 { font-size: 2.5rem; text-shadow: 0 0 10px rgba(99, 102, 241, 0.5); margin-bottom: 5px; text-align: center; }
        .subtitle { color: #94a3b8; margin-bottom: 25px; text-align: center; font-size: 1rem; }
        
        /* Sélecteur de Langue */
        .language-zone { margin-bottom: 30px; display: flex; gap: 15px; align-items: center; background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); }
        .language-zone label { font-weight: bold; color: #38bdf8; }
        select { background: #1e1b4b; color: white; border: 1px solid #6366f1; padding: 8px 15px; border-radius: 8px; font-size: 1rem; cursor: pointer; outline: none; }

        /* Section Flashcards */
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            width: 320px; height: 180px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; font-weight: bold; cursor: pointer;
            transition: transform 0.3s; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .card:hover { transform: scale(1.03); }
        .btn-next {
            margin: 15px 0 40px 0; background: #6366f1; color: white; border: none;
            padding: 12px 30px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); transition: background 0.2s;
        }
        .btn-next:hover { background: #4f46e5; }

        /* Section Premium Vidéos */
        .premium-container { width: 100%; max-width: 600px; text-align: left; }
        .section-title { font-size: 1.4rem; color: #38bdf8; margin-bottom: 15px; font-weight: bold; }
        .video-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media(min-width: 500px) { .video-grid { grid-template-columns: 1fr 1fr; } }
        .video-box {
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 15px; position: relative; min-height: 90px;
            display: flex; flex-direction: column; justify-content: center; cursor: not-allowed;
        }
        .video-box h3 { margin: 0 0 5px 0; font-size: 1rem; color: #f8fafc; }
        .video-box p { margin: 0; font-size: 0.8rem; color: #94a3b8; }
        .lock-icon { position: absolute; top: 15px; right: 15px; font-size: 1.2rem; }
        
        /* Bouton d'achat */
        .paywall-btn {
            grid-column: 1 / -1; background: linear-gradient(90deg, #f59e0b, #ef4444);
            color: white; font-weight: bold; border: none; padding: 15px;
            border-radius: 10px; cursor: pointer; text-align: center; font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); margin-top: 10px; transition: opacity 0.2s;
        }
        .paywall-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <h1>⚡ LingoFlash Global ⚡</h1>
    <div class="subtitle">Plateforme d'apprentissage multilingue internationale</div>

    <!-- Zone de Sélection de la Langue -->
    <div class="language-zone">
        <label for="langSelect">Je veux apprendre :</label>
        <select id="langSelect" onchange="changeLanguage()">
            <option value="en">🇺🇸 Anglais (Global)</option>
            <option value="es">🇪🇸 Espagnol (Amérique Latine / Espagne)</option>
            <option value="fr">🇫🇷 Français (Europe / Canada)</option>
        </select>
    </div>

    <!-- Zone Flashcards Gratuite -->
    <div class="card" id="flashcard" onclick="flipCard()">Hello</div>
    <button class="btn-next" onclick="nextCard()">Mot Suivant ➡️</button>

    <!-- Zone Vidéo Payante -->
    <div class="premium-container">
        <div class="section-title">📹 Cours & Vidéos Premium (<span id="premiumLangTitle">Anglais</span>)</div>
        <div class="video-grid">
            <div class="video-box">
                <h3 id="vid1Title">🗣️ Master Vocabulaire Anglais</h3>
                <p>Contenu exclusif • Vidéo 4K Ultra HD</p>
                <div class="lock-icon">🔒</div>
            </div>
            <div class="video-box">
                <h3 id="vid2Title">✈️ Anglais pour les Affaires & Voyages</h3>
                <p>Contenu exclusif • Vidéo 4K Ultra HD</p>
                <div class="lock-icon">🔒</div>
            </div>
            <button class="paywall-btn" onclick="alert('Redirection vers la passerelle de paiement sécurisée Stripe... (9.99$/mois)')">
                🚀 Débloquer tout le contenu Mondial (9.99$ / mois)
            </button>
        </div>
    </div>

    <script>
        const dataset = {
            en: {
                title: "Anglais",
                vids: ["🗣️ Master Vocabulaire Anglais", "✈️ Anglais pour Affaires & Voyage"],
                words: [
                    { native: "Hello", target: "Bonjour 👋" },
                    { native: "Thank you", target: "Merci 🙏" },
                    { native: "Success", target: "Succès 💰" }
                ]
            },
            es: {
                title: "Espagnol",
                vids: ["💃 Espagnol Courant : Parler vite", "🌴 Espagnol de tous les jours"],
                words: [
                    { native: "Hola", target: "Bonjour 👋" },
                    { native: "Gracias", target: "Merci 🙏" },
                    { native: "Éxito", target: "Succès 💰" }
                ]
            },
            fr: {
                title: "Français",
                vids: ["🥖 Prononciation parfaite", "☕ Conversation de la vie réelle"],
                words: [
                    { native: "Bonjour", target: "Hello 👋" },
                    { native: "Merci", target: "Thank you 🙏" },
                    { native: "Succès", target: "Success 💰" }
                ]
            }
        };

        let currentLang = "en";
        let currentIndex = 0;
        let isFlipped = false;

        function updateUI() {
            const langData = dataset[currentLang];
            
            document.getElementById('premiumLangTitle').innerText = langData.title;
            document.getElementById('vid1Title').innerText = langData.vids[0];
            document.getElementById('vid2Title').innerText = langData.vids[1];
            
            isFlipped = false;
            currentIndex = 0;
            const card = document.getElementById('flashcard');
            card.innerText = langData.words[currentIndex].native;
            card.style.color = "#ffffff";
        }

        function changeLanguage() {
            currentLang = document.getElementById('langSelect').value;
            updateUI();
        }

        function flipCard() {
            const card = document.getElementById('flashcard');
            const langData = dataset[currentLang];
            isFlipped = !isFlipped;
            
            if (isFlipped) {
                card.innerText = langData.words[currentIndex].target;
                card.style.color = "#38bdf8";
            } else {
                card.innerText = langData.words[currentIndex].native;
                card.style.color = "#ffffff";
            }
        }

        function nextCard() {
            const langData = dataset[currentLang];
            currentIndex = (currentIndex + 1) % langData.words.length;
            isFlipped = false;
            const card = document.getElementById('flashcard');
            card.innerText = langData.words[currentIndex].native;
            card.style.color = "#ffffff";
        }

        updateUI();
    </script>
</body>
</html>
