<!DOCTYPE html> <html lang="fr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>LingoFlash Global</title> <style> body { background: linear-gradient(135deg, #0f172a, #1e1b4b); color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; } h1 { font-size: 2.5rem; margin-bottom: 20px; text-shadow: 0 0 10px rgba(99, 102, 241, 0.5); } .card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 20px; width: 300px; height: 200px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: bold; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: transform 0.3s, background 0.3s; } .card:hover { transform: scale(1.05); background: rgba(255, 255, 255, 0.15); } </style> </head> <body> <h1>⚡ LingoFlash Global ⚡</h1> <div class="card" onclick="toggleCard(this)">Hello</div> <script> function toggleCard(element) { if (element.innerText === "Hello") { element.innerText = "Bonjour 👋"; element.style.color = "#38bdf8"; } else { element.innerText = "Hello"; element.style.color = "#ffffff"; } } </script> </body> </html>
