<!DOCTYPE html> <html lang="fr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>LingoFlash Global</title> <style> body { background: linear-gradient(135deg, #0f172a, #1e1b4b); color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; } h1 { font-size: 2.5rem; margin-bottom: 20px; text-shadow: 0 0 10px rgba(99, 102, 241, 0.5); } .card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 20px; width: 300px; height: 200px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: bold; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: transform 0.3s, background 0.3s; text-align: center; padding: 10px; } .card:hover { transform: scale(1.05); background: rgba(255, 255, 255, 0.15); } .btn { margin-top: 30px; background: #6366f1; color: white; border: none; padding: 12px 30px; font-size: 1.1rem; font-weight: bold; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); transition: background 0.2s, transform 0.1s; } .btn:hover { background: #4f46e5; transform: translateY(-2px); } .btn:active { transform: translateY(0); } </style> </head> <body> <h1>⚡ LingoFlash Global ⚡</h1> <div class="card" id="flashcard" onclick="flipCard()">Hello</div> <button class="btn" onclick="nextCard()">Suivant ➡️</button> <script> const words = [ { eng: "Hello", fr: "Bonjour 👋" }, { eng: "Thank you", fr: "Merci 🙏" }, { eng: "Goodbye", fr: "Au revoir 🏁" }, { eng: "Welcome", fr: "Bienvenue 🏠" }, { eng: "Please", fr: "S'il vous plaît ✨" } ]; let currentIndex = 0; let isFlipped = false; function flipCard() { const card = document.getElementById('flashcard'); isFlipped = !isFlipped; if (isFlipped) { card.innerText = words[currentIndex].fr; card.style.color = "#38bdf8"; } else { card.innerText = words[currentIndex].eng; card.style.color = "#ffffff"; } } function nextCard() { currentIndex = (currentIndex + 1) % words.length; isFlipped = false; const card = document.getElementById('flashcard'); card.innerText = words[currentIndex].eng; card.style.color = "#ffffff"; } </script> </body> </html>
