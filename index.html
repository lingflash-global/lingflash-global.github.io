<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoFlash Global - Proc</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
            margin-bottom: 5px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1rem;
        }

        main {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .controls-zone {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            backdrop-filter: blur(10px);
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        label {
            font-weight: bold;
            color: #38bdf8;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        select, input {
            background: #0f172a;
            color: white;
            border: 1px solid #475569;
            padding: 10px 15px;
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        select {
            width: 60%;
            cursor: pointer;
        }

        input {
            width: 100%;
            box-sizing: border-box;
        }

        select:focus, input:focus {
            border-color: #38bdf8;
        }

        .card-container {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid #475569;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .word-display {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 0.02em;
        }

        .translation-display {
            color: #94a3b8;
            font-style: italic;
            font-size: 1rem;
        }

        .card-footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-t: 1px solid rgba(71, 85, 105, 0.4);
        }

        .counter {
            font-size: 0.8rem;
            color: #94a3b8;
            background: #0f172a;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

        .audio-btn {
            background: #2563eb;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: transform 0.2s, background-color 0.2s;
        }

        .audio-btn:hover {
            background: #1d4ed8;
            transform: scale(1.05);
        }

        .next-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            align-self: center;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        .next-btn:hover:not(:disabled) {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .premium-zone {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .video-grid {
            display: grid;
            grid-template-cols: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 480px) {
            .video-grid { grid-template-cols: 1fr; }
        }

        .video-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            position: relative;
        }

        .lock-icon {
            position: absolute;
            top: 12px;
            right: 12px;
            color: #64748b;
            font-size: 0.9rem;
        }

        .video-card h4 {
            margin: 0 0 5px 0;
            font-size: 0.95rem;
        }

        .video-card p {
            margin: 0;
            font-size: 0.75rem;
            color: #64748b;
        }

        .premium-btn {
            background: linear-gradient(90deg, #f59e0b, #f97316, #eab308);
            color: #0f172a;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(249, 115, 22, 0.2);
            transition: transform 0.2s, opacity 0.2s;
        }

        .premium-btn:hover {
            opacity: 0.95;
            transform: scale(1.01);
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ LingoFlash Global ⚡</h1>
        <div class="subtitle">Banque de données interactive multilingue</div>
    </header>

    <main>

        <div class="card-container">

        <button id="nextBtn" class="next-btn">Mot Suivant ➡️</button>

        <div class="premium-zone">
            <label id="videoSectionTitle">🎓 Cours Vidéos Avancés</label>
            <div class="video-grid">
                <div class="video-card">
                    <span class="lock-icon">🔒</span>
                    <h4>Fluidité et Expressions</h4>
                    <p>Contenu exclusif • Vidéo 4K</p>
                </div>
                <div class="video-card">
                    <span class="lock-icon">🔒</span>

                </div>
            </div>
            <button class="premium-btn">⭐ Débloquer tout le contenu Mondial (9.99$ / mois)</button>
        </div>
    </main>
