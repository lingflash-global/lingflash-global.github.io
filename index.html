<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoFlash Global</title>
    <!-- Tailwind CSS pour le style professionnel -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #0f1123; color: white; font-family: sans-serif; }
    </style>
</head>
<body class="min-h-screen antialiased pb-12">

    <!-- Header global -->
    <header class="pt-8 text-center">
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight flex items-center justify-center gap-2">
            ⚡ LingoFlash Global ⚡
        </h1>
        <p class="text-gray-400 text-sm mt-2">
            Banque de données interactive multilingue
        </p>
    </header>

    <!-- Zone Principale d'Apprentissage -->
    <main class="max-w-2xl mx-auto px-4 mt-8 space-y-6">
        
        <!-- Boîtier de contrôle des filtres -->
        <div class="bg-[#161a36] border border-[#232954] rounded-xl p-6 space-y-4 shadow-xl">
            <!-- Menu déroulant des pays/langues -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <label class="text-blue-400 font-bold text-sm uppercase tracking-wider">
                    Langue :
                </label>
                <select id="langSelect" class="bg-[#0f1123] border border-[#2d3566] text-white rounded-lg px-4 py-2.5 outline-none focus:border-blue-500 transition w-full sm:w-64 cursor-pointer">
                    <!-- Les options seront générées par le JavaScript -->
                </select>
            </div>

            <!-- Barre de recherche -->
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">🔍</span>
                <input id="searchInput" type="text" placeholder="Filtrer les expressions..." class="w-full bg-[#0f1123] border border-[#2d3566] text-white rounded-lg pl-10 pr-4 py-2.5 outline-none focus:border-blue-500 transition text-sm">
            </div>
        </div>

        <!-- Fenêtre Flashcard de l'expression -->
        <div class="bg-[#1b2044] border border-[#2d3566] rounded-2xl p-8 text-center shadow-2xl relative min-h-[220px] flex flex-col justify-between items-center transition-all duration-300">
            <div class="space-y-4 my-auto" id="cardContent">
                <!-- Rempli dynamiquement -->
            </div>

            <div class="w-full flex justify-between items-center mt-6 pt-4 border-t border-[#2d3566]/50">
                <span id="expressionCount" class="text-xs text-gray-400 font-medium bg-[#0f1123] px-3 py-1 rounded-full">
                    Expression 0 / 0
                </span>

                <!-- Bouton Audio -->
                <button id="audioBtn" class="p-3 rounded-full bg-blue-600 hover:bg-blue-500 text-white hover:scale-105 transition-all" title="Écouter la prononciation">
                    🔊
                </button>
            </div>
        </div>

        <!-- Bouton Mot Suivant -->
        <div class="flex justify-center">
            <button id="nextBtn" class="bg-[#2563eb] hover:bg-[#1d4ed8] disabled:opacity-50 text-white font-semibold px-8 py-3 rounded-lg flex items-center gap-2 shadow-lg shadow-blue-900/30 transition-all">
                Mot Suivant ➡️
            </button>
        </div>

        <!-- Section Cours Vidéos Avancés -->
        <div class="pt-6 space-y-4">
            <h3 id="videoSectionTitle" class="text-lg font-bold text-gray-300 flex items-center gap-2">
                🎓 Cours Vidéos Avancés
            </h3>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-[#131730] border border-[#232954] rounded-xl p-5 relative overflow-hidden group">
                    <div class="absolute top-3 right-3 text-gray-500">🔒</div>
                    <h4 class="font-bold text-white mb-1">👤 Fluidité et Expressions</h4>
                    <p class="text-xs text-gray-400">Contenu exclusif • Vidéo 4K Ultra HD</p>
                </div>

                <div class="bg-[#131730] border border-[#232954] rounded-xl p-5 relative overflow-hidden group">
                    <div class="absolute top-3 right-3 text-gray-500">🔒</div>
                    <h4 class="font-bold text-white mb-1">💼 Négociation et Parler Pro</h4>
                    <p class="text-xs text-gray-400">Contenu exclusif • Vidéo 4K Ultra HD</p>
                </div>
            </div>

            <!-- Bouton Premium -->
            <button class="w-full bg-gradient-to-r from-amber-500 via-orange-500 to-yellow-500 text-[#0f1123] font-black text-sm uppercase tracking-wider py-4 rounded-xl shadow-xl hover:opacity-95 transition-all hover:scale-[1.01] flex items-center justify-center gap-2 mt-2">
                ⭐ Débloquer tout le contenu Mondial (9.99$ / mois)
            </button>
        </div>
    </main>

    <!-- Logique JavaScript Interactive et Correction du Bug -->
    <script>
        const GLOBAL_LANGUAGES = {
            es: {
                label: "Espagnol", flag: "🇪🇸",
                expressions: [
                    { id: 1, source: "Bonjour", target: "¡Hola!", audio: "Hola" },
                    { id: 2, source: "Merci beaucoup", target: "Muchas gracias", audio: "Muchas gracias" },
                    { id: 3, source: "Comment ça va ?", target: "¿Cómo estás?", audio: "¿Cómo estás?" }
                ]
            },
            en: {
                label: "Anglais", flag: "🇬🇧",
                expressions: [
                    { id: 1, source: "Bonjour", target: "Hello", audio: "Hello" },
                    { id: 2, source: "Comment ça va ?", target: "How are you?", audio: "How are you" }
                ]
            },
            de: {
                label: "Allemand", flag: "🇩🇪",
                expressions: [{ id: 1, source: "Bonjour", target: "Guten Tag", audio: "Guten Tag" }]
            },
            it: {
                label: "Italien", flag: "🇮🇹",
                expressions: [{ id: 1, source: "Bonjour", target: "Buongiorno", audio: "Buongiorno" }]
            }
        };

        let currentLang = "es";
        let searchQuery = "";
        let currentIndex = 0;
        let filteredExpressions = [];

        const langSelect = document.getElementById("langSelect");
        const searchInput = document.getElementById("searchInput");
        const cardContent = document.getElementById("cardContent");
        const expressionCount = document.getElementById("expressionCount");
        const nextBtn = document.getElementById("nextBtn");
        const audioBtn = document.getElementById("audioBtn");
        const videoSectionTitle = document.getElementById("videoSectionTitle");

        // Initialiser le sélecteur de langues
        function initLanguages() {
            langSelect.innerHTML = Object.entries(GLOBAL_LANGUAGES).map(([key, lang]) => 
                `<option value="${key}">${lang.flag} ${lang.label}</option>`
            ).join("");
        }

        // Mettre à jour l'affichage de la Flashcard
        function updateUI() {
            const langData = GLOBAL_LANGUAGES[currentLang];
            videoSectionTitle.innerHTML = `🎓 Cours Vidéos Avancés (${langData.label})`;

            filteredExpressions = langData.expressions.filter(exp => 
                exp.source.toLowerCase().includes(searchQuery.toLowerCase()) ||
                exp.target.toLowerCase().includes(searchQuery.toLowerCase())
            );

            if (filteredExpressions.length > 0) {
                if (currentIndex >= filteredExpressions.length) currentIndex = 0;
                const currentExp = filteredExpressions[currentIndex];
                
                // CORRECTION DU BUG : On affiche la traduction cible (target) au centre en grand
                cardContent.innerHTML = `
                    <h2 class="text-4xl font-bold tracking-wide text-white">${currentExp.target}</h2>
                    <p class="text-gray-400 text-sm italic">Signifie en Français : ${currentExp.source}</p>
                `;
                expressionCount.innerText = `Expression ${currentIndex + 1} / ${filteredExpressions.length}`;
                nextBtn.disabled = filteredExpressions.length <= 1;
                audioBtn.disabled = false;
            } else {
                cardContent.innerHTML = `<p class="text-gray-400">Aucune expression trouvée.</p>`;
                expressionCount.innerText = "Expression 0 / 0";
                nextBtn.disabled = true;
                audioBtn.disabled = true;
            }
        }

        // Événements
        langSelect.addEventListener("change", (e) => {
            currentLang = e.target.value;
            currentIndex = 0;
            updateUI();
        });

        searchInput.addEventListener("input", (e) => {
            searchQuery = e.target.value;
            currentIndex = 0;
            updateUI();
        });

        nextBtn.addEventListener("click", () => {
            if (filteredExpressions.length > 0) {
                currentIndex = (currentIndex + 1) % filteredExpressions.length;
                updateUI();
            }
        });

        audioBtn.addEventListener("click", () => {
            if (filteredExpressions[currentIndex]) {
                const utterance = new SpeechSynthesisUtterance(filteredExpressions[currentIndex].audio);
                utterance.lang = currentLang === "en" ? "en-US" : currentLang;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            }
        });

        // Lancement
        initLanguages();
        updateUI();
    </script>
</body>
</html>
